services:
  - type: web
    name: buscapormi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 180 --access-logfile -
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.tokenrouter.com/v1
      - key: AI_MODEL
        value: openai/gpt-5.4-nano